services:
  - type: web
    name: plantmed
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn plantmed.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ALLOWED_HOSTS
        value: .onrender.com
